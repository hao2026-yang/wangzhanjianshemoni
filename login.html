<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 抖音</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body class="login-page">

<div class="login-card">
  <a href="index.html" class="logo-text">抖音</a>
  <p class="sub">记录美好生活</p>

  <form id="loginForm">
    <div class="field">
      <label for="phone">手机号 / 邮箱</label>
      <input type="text" id="phone" placeholder="请输入手机号或邮箱" autocomplete="username">
    </div>
    <div class="field">
      <label for="pwd">密码</label>
      <input type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password">
    </div>

    <button class="submit" type="submit">登录</button>
  </form>

  <p class="login-tip">未注册的手机号将自动创建账号　·　<a href="#">获取验证码</a></p>
  <a href="index.html" class="login-back">‹ 返回首页，先随便逛逛</a>
</div>

<script src="js/app.js"></script>
</body>
</html>
